<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="theme-toggle" title="Toggle Dark/Light Mode">🌙</button>
        <h1>Lotto Number Generator</h1>
        <p>Click the button to generate your lucky numbers!</p>
        <div class="numbers-container">
            <span class="number"></span>
            <span class="number"></span>
            <span class="number"></span>
            <span class="number"></span>
            <span class="number"></span>
            <span class="number"></span>
        </div>
        <div class="actions">
            <button id="generate-btn">Generate Numbers</button>
            <button id="copy-btn">Copy Numbers</button>
        </div>

        <hr class="separator">

        <section class="partnership-form">
            <h2>Partnership Inquiry</h2>
            <p>Interested in collaborating? Send us a message!</p>
            <form action="https://formspree.io/f/xwvylyyo" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="How can we help?" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </div>
    <script src="main.js"></script>
</body>
</html>
